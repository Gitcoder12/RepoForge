[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repoforge"
version = "0.6.0"
description = "Autonomous AI Repository Engineering Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DHARAVATH SATVIK", email = "gitcoder12@users.noreply.github.com"}]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
all = ["google-generativeai>=0.3.0"]

[project.scripts]
repoforge = "repoforge.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
