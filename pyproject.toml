[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repoforge"
version = "0.6.0"
description = "Autonomous AI Repository Engineering Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DHARAVATH SATVIK", email = "gitcoder12@users.noreply.github.com"}]
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
providers = ["openai>=1.0.0", "anthropic>=0.7.0"]
all = ["google-generativeai>=0.3.0", "openai>=1.0.0", "anthropic>=0.7.0"]

[project.scripts]
repoforge = "repoforge.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["repoforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
