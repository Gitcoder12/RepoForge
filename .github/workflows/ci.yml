name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint canonical package and tests
        run: ruff check src/repoforge tests
      - name: Check formatting
        run: ruff format --check src/repoforge tests
      - name: Run unit tests
        run: pytest -q
      - name: Verify installed CLI
        run: |
          repoforge --help
          repoforge version
